name: Validate and render original example
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          python -c "import os,pathlib; p=pathlib.Path('.venv', 'Scripts' if os.name == 'nt' else 'bin').resolve(); open(os.environ['GITHUB_PATH'],'a',encoding='utf-8').write(str(p)+'\n')"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm test
      - run: pnpm test:smoke
        env:
          PYTHON: python
      - run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-skill-${{ runner.os }}
          path: dist/*.zip
