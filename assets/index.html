<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素 MV 预览</title>
<style>
  body { margin:0; background:#07070f; color:#ecebf5; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:16px; }
  canvas { width:100%; display:block; margin:0 auto; image-rendering:pixelated; background:#000; }
  body.portrait canvas { width:auto; height:min(86vh, 960px); }
  .bar { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { background:#12122a; color:#ecebf5; border:1px solid #2a2850; padding:6px 10px; border-radius:6px; cursor:pointer; }
  input[type=range] { flex:1; min-width:200px; } .time { font-variant-numeric:tabular-nums; color:#8a87a6; min-width:110px; }
  body.render .wrap { padding:0; max-width:none; } body.render canvas { width:auto !important; height:auto !important; margin:0; } body.render .ui { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="screen"></canvas>
  <div class="ui">
    <div class="bar"><button id="play">▶ 播放</button><input id="seek" type="range" min="0" step="0.01" value="0"><span class="time" id="time">0:00.00</span></div>
    <div class="bar" id="secs"></div>
    <p style="color:#8a87a6;font-size:13px">把音频放在同一文件夹，在 config.js 里设置 audio。空格 播放/暂停，←/→ ±2 秒，, / . 逐帧。网址加 ?t=秒 从指定位置开始。字幕对不上就改 plan.json 并重新生成 lyrics.js。横竖屏在 config.js 里切换。</p>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>
<script src="config.js"></script>
<script src="lyrics.js"></script>
<script src="engine.js"></script>
<script src="kit.js"></script>
<script src="scenes.js"></script>
<!-- 场景拆成多个文件时，在这里继续引入 scenes2.js 等 -->
<script>
  const { Raster, compose, AW, AH, UW, UH, PORTRAIT } = PX;
  const A = new Raster(AW, AH), U = new Raster(UW, UH), O = new Raster(UW, UH);
  const cv = document.getElementById('screen'); cv.width = UW; cv.height = UH;
  if (PORTRAIT) document.body.classList.add('portrait');
  const ctx = cv.getContext('2d');
  window.renderAt = t => { MV.render(A, U, t); compose(A, U, O); ctx.putImageData(O.img, 0, 0); };
  const q = new URLSearchParams(location.search);
  if (q.has('render')) document.body.classList.add('render');
  else {
    const audio = document.getElementById('audio'), seek = document.getElementById('seek'), timeEl = document.getElementById('time'), play = document.getElementById('play');
    seek.max = MV.duration;
    audio.src = window.MV_CONFIG.audio || 'song.mp3';
    audio.addEventListener('loadedmetadata', () => { audio.currentTime = Math.max(0, Math.min(MV.duration, parseFloat(q.get('t')) || 0)); }, { once: true });
    const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')}`;
    MV.sections.forEach(s => { const b = document.createElement('button'); b.textContent = `${s.name} ${fmt(s.start)}`; b.onclick = () => audio.currentTime = s.start; document.getElementById('secs').appendChild(b); });
    play.onclick = () => audio.paused ? audio.play() : audio.pause();
    audio.onplay = () => play.textContent = '❚❚ 暂停'; audio.onpause = () => play.textContent = '▶ 播放';
    seek.oninput = () => audio.currentTime = parseFloat(seek.value);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); play.click(); }
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 2);
      if (e.key === 'ArrowRight') audio.currentTime += 2;
      if (e.key === ',') audio.currentTime = Math.max(0, audio.currentTime - 1 / 30);
      if (e.key === '.') audio.currentTime += 1 / 30;
    });
    (function loop() { const n = audio.currentTime || 0; renderAt(n); seek.value = n; timeEl.textContent = fmt(n); requestAnimationFrame(loop); })();
  }
</script>
</body>
</html>
